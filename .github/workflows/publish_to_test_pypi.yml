name: Build and Publish to Test PyPI

on:
  workflow_dispatch:

permissions:
  contents: write  # For creating draft releases

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # just for cibuildwheel tool, not the built wheels

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels with cibuildwheel
        run: |
          cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *musllinux*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: universal2
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: 'python -c "import tactics2d, cpp_geometry, cpp_interpolator; from tactics2d.behavior import BehaviorModelBase"'
          CIBW_BEFORE_BUILD: "pip install --upgrade setuptools"

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-wheels-${{ matrix.os }}
          path: dist/

  publish:
    name: Publish to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge all artifacts into dist/
        run: |
          mkdir -p final_dist
          find dist -name '*.whl' -exec cp {} final_dist/ \;

      - name: Build and validate source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --outdir final_dist
          python -m twine check final_dist/*

      - name: Read package version from pyproject.toml
        id: get_version
        run: |
          version=$(python .github/scripts/get_version.py)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Read version: $version"

      - name: Extract release notes from CHANGELOG.md
        run: |
          python .github/scripts/extract_changelog.py ${{ steps.get_version.outputs.version }}

      - name: Check if version exists on Test PyPI
        id: check_test_pypi_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Checking if version $VERSION exists on Test PyPI..."
          set +e
          python .github/scripts/check_pypi_version.py "$VERSION" --repository-url "https://test.pypi.org/legacy/"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Version $VERSION already exists on Test PyPI"
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "test_pypi_outcome=skipped" >> $GITHUB_OUTPUT
          elif [ "$STATUS" -eq 1 ]; then
            echo "Version $VERSION does not exist on Test PyPI"
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "test_pypi_outcome=needed" >> $GITHUB_OUTPUT
          else
            echo "Could not reliably check Test PyPI; refusing to publish."
            exit "$STATUS"
          fi

      - name: Install GitHub CLI and jq
        run: |
          sudo apt update
          sudo apt install gh jq -y

      - name: Create draft GitHub Release (Test)
        id: create_draft_release
        run: |
          set -e  # Exit immediately if any command fails

          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="v${VERSION}"
          EXPECTED_NAME="Release $VERSION (Test)"

          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ (rc|beta|alpha) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          PUBLISHED_ID=$(echo "$RELEASES" | jq -r --arg tag "$TAG" \
            '[.[] | select(.draft == false and .tag_name == $tag)] | first | .id // empty')
          if [ -n "$PUBLISHED_ID" ]; then
            echo "Error: Release $TAG is already published; refusing to overwrite it."
            exit 1
          fi

          # Draft releases may use an internal untagged-* name until publication,
          # so locate them by their release title through the stable REST fields.
          echo "$RELEASES" | jq -r --arg name "$EXPECTED_NAME" \
            '.[] | select(.draft == true and .name == $name) | .id' | while read -r RELEASE_ID; do
              [ -n "$RELEASE_ID" ] || continue
              echo "Deleting superseded draft release id $RELEASE_ID..."
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          done

          if EXISTING_TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha' 2>/dev/null); then
            if [ "$EXISTING_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Error: tag $TAG already points to $EXISTING_TAG_SHA instead of $GITHUB_SHA"
              exit 1
            fi
          fi

          # Create new draft release
          echo "Creating draft release with tag $TAG..."
          CREATED_URL=$(gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION (Test)" \
            --notes-file release_notes.txt \
            --draft \
            $PRERELEASE_FLAG \
            --repo "${{ github.repository }}")

          # Drafts without a published Git ref may receive an untagged-* name.
          # gh prints the canonical release URL, whose final path component is
          # the identifier accepted by later release upload/download commands.
          CREATED_TAG="${CREATED_URL##*/}"
          if [ -z "$CREATED_TAG" ]; then
            echo "Error: GitHub did not return the created draft release URL."
            exit 1
          fi

          echo "Created draft release $CREATED_TAG"
          echo "tag_name=$CREATED_TAG" >> "$GITHUB_OUTPUT"
          echo "release_created=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Test PyPI
        id: publish_test_pypi
        if: steps.check_test_pypi_version.outputs.version_exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: final_dist/
          verbose: true

      - name: Upload wheel packages to Draft Release
        if: steps.publish_test_pypi.outcome == 'success' || steps.check_test_pypi_version.outputs.version_exists == 'true'
        run: |
          for wheel in final_dist/*.whl; do
            echo "Uploading $wheel"
            gh release upload "${{ steps.create_draft_release.outputs.tag_name }}" "$wheel" \
              --clobber \
              --repo "${{ github.repository }}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload source archive to Draft Release
        if: steps.publish_test_pypi.outcome == 'success' || steps.check_test_pypi_version.outputs.version_exists == 'true'
        run: |
          gh release upload "${{ steps.create_draft_release.outputs.tag_name }}" "final_dist/tactics2d-${{ steps.get_version.outputs.version }}.tar.gz" \
            --clobber \
            --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Draft Release artifacts
        if: steps.publish_test_pypi.outcome == 'success' || steps.check_test_pypi_version.outputs.version_exists == 'true'
        run: |
          DRAFT_TAG="${{ steps.create_draft_release.outputs.tag_name }}"
          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          DRAFT=$(echo "$RELEASES" | jq -c --arg tag "$DRAFT_TAG" --arg sha "$GITHUB_SHA" \
            '[.[] | select(.draft == true and .tag_name == $tag and .target_commitish == $sha)] | first // empty')
          if [ -z "$DRAFT" ]; then
            echo "Error: created draft $DRAFT_TAG was not found at $GITHUB_SHA."
            exit 1
          fi

          WHEEL_COUNT=$(echo "$DRAFT" | jq '[.assets[].name | select(endswith(".whl"))] | length')
          SDIST_COUNT=$(echo "$DRAFT" | jq '[.assets[].name | select(endswith(".tar.gz"))] | length')
          if [ "$WHEEL_COUNT" -ne 12 ] || [ "$SDIST_COUNT" -ne 1 ]; then
            echo "Error: draft has $WHEEL_COUNT wheels and $SDIST_COUNT source distributions; expected 12 and 1."
            exit 1
          fi

          echo "Verified 12 wheels and 1 source distribution on draft $DRAFT_TAG."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clean up on Test PyPI failure
      # Only clean up if Test PyPI failed for reasons other than version already existing
      - name: Clean up on Test PyPI failure
        if: steps.publish_test_pypi.outcome == 'failure' && steps.check_test_pypi_version.outputs.version_exists != 'true'
        run: |
          echo "Test PyPI publishing failed. Cleaning up draft release and tag..."
          gh release delete "${{ steps.create_draft_release.outputs.tag_name }}" \
            --yes --cleanup-tag \
            --repo "${{ github.repository }}"
          echo "Draft release and tag deleted."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
