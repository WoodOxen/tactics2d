name: Publish validated artifacts to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (must match pyproject.toml)"
        required: true
        type: string

jobs:
  publish:
    name: Publish to PyPI and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release source and version
        id: get_version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Error: production releases must run from master, got $GITHUB_REF"
            exit 1
          fi

          VERSION=$(python .github/scripts/get_version.py)
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ "$VERSION" != "$INPUT_VERSION" ]; then
            echo "Error: pyproject.toml contains $VERSION, but the workflow input was $INPUT_VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated release version $VERSION"

      - name: Extract release notes
        run: |
          python .github/scripts/extract_changelog.py "${{ steps.get_version.outputs.version }}"

      - name: Install release tools
        run: |
          sudo apt update
          sudo apt install gh jq -y
          python -m pip install --upgrade twine

      - name: Locate the validated draft release
        id: draft_release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="v${VERSION}"
          EXPECTED_NAME="Release $VERSION (Test)"

          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          DRAFT=$(echo "$RELEASES" | jq -c --arg tag "$TAG" --arg name "$EXPECTED_NAME" \
            '[.[] | select(.draft == true and (.tag_name == $tag or .name == $name))] | first // empty')
          if [ -z "$DRAFT" ]; then
            echo "Error: draft release $TAG / '$EXPECTED_NAME' was not found."
            echo "Run the Test PyPI workflow from this exact master commit first."
            exit 1
          fi

          DRAFT_TAG=$(echo "$DRAFT" | jq -r '.tag_name')
          DRAFT_TARGET=$(echo "$DRAFT" | jq -r '.target_commitish')
          if [ "$DRAFT_TARGET" != "$GITHUB_SHA" ]; then
            echo "Error: draft release targets $DRAFT_TARGET, but this workflow is running at $GITHUB_SHA"
            echo "Re-run the Test PyPI workflow from this exact master commit."
            exit 1
          fi

          echo "tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated draft release $DRAFT_TAG at $GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and validate release artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DRAFT_TAG="${{ steps.draft_release.outputs.tag }}"
          FINAL_TAG="v${VERSION}"
          mkdir -p final_dist
          gh release download "$TAG" --dir final_dist --repo "${{ github.repository }}"

          test -f "final_dist/tactics2d-${VERSION}.tar.gz" || {
            echo "Error: source distribution is missing."
            exit 1
          }

          for PY_TAG in cp310 cp311 cp312 cp313; do
            find final_dist -maxdepth 1 -name "*${PY_TAG}*manylinux_2_28_x86_64.whl" -print -quit | grep -q . || {
              echo "Error: missing Linux wheel for $PY_TAG"
              exit 1
            }
            find final_dist -maxdepth 1 -name "*${PY_TAG}*win_amd64.whl" -print -quit | grep -q . || {
              echo "Error: missing Windows wheel for $PY_TAG"
              exit 1
            }
            find final_dist -maxdepth 1 -name "*${PY_TAG}*macosx*universal2.whl" -print -quit | grep -q . || {
              echo "Error: missing macOS universal2 wheel for $PY_TAG"
              exit 1
            }
          done

          python -m twine check final_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version exists on PyPI
        id: check_pypi_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          set +e
          python .github/scripts/check_pypi_version.py "$VERSION"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "Version $VERSION already exists on PyPI; publication will be skipped."
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -eq 1 ]; then
            echo "Version $VERSION does not exist on PyPI."
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not reliably check PyPI; refusing to publish."
            exit "$STATUS"
          fi

      - name: Publish to PyPI
        id: publish_pypi
        if: steps.check_pypi_version.outputs.version_exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: final_dist/
          verbose: true

      - name: Publish GitHub Release
        if: steps.publish_pypi.outcome == 'success' || steps.check_pypi_version.outputs.version_exists == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="${{ steps.draft_release.outputs.tag }}"

          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ (rc|beta|alpha) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release edit "$DRAFT_TAG" \
            --tag "$FINAL_TAG" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes-file release_notes.txt \
            --draft=false \
            $PRERELEASE_FLAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve draft on PyPI failure
        if: steps.publish_pypi.outcome == 'failure' && steps.check_pypi_version.outputs.version_exists != 'true'
        run: |
          echo "PyPI publication failed; the validated draft release remains available for inspection."
