[project]
name = "tactics2d"
version = "0.1.9rc3"
description = "Tactics2D: A Reinforcement Learning Environment Library with Generative Scenarios for Driving Decision-making"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "GPL-3.0-only" }
license-files = ["LICENSE"]
requires-python = ">= 3.8"
keywords = ["reinforcement-learning", "environment", "simulator", "decision-making", "traffic-behavior"]
authors = [
    { name = "Yueyuan Li", email = "rowena.academic@gmail.com" }
]
maintainers = [
    { name = "Yueyuan Li", email = "rowena.academic@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dynamic = ["dependencies"]

[project.scripts]
tactics2d = "tactics2d.cli:main"

[project.urls]
Documentation = "https://tactics2d.readthedocs.io/en/latest/"
Repository = "https://github.com/WoodOxen/tactics2d"

[project.optional-dependencies]
test = [
    "Pillow>=9.5.0",
    "httpx>=0.28.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "torch>=2.8.0, <2.9.0; python_version >= '3.9'",
    "torchvision>=0.23.0, <0.24.0; python_version >= '3.9'",
]
dev = [
    "pre-commit==3.5.0",
    "black",
    "isort",
    "clang-format",
]
bits = [
    "torch>=2.8.0, <2.9.0; python_version >= '3.9'",
    "torchvision>=0.23.0, <0.24.0; python_version >= '3.9'",
]

[build-system]
requires = [
    "setuptools >= 60.0.0",
    "wheel",
    "pybind11>=2.10.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tactics2d = [
    "participant/trajectory_classifier.m",
    "display/renderers/web/static/**",
]

[tool.setuptools.packages.find]
exclude = [
    "test",
    "test.*",
    "tests",
    "tests.*",
    "*.test",
    "*.test.*",
    "*.tests",
    "*.tests.*",
    "tactics2d.data",
    "tactics2d.data.*",
]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.black]
line-length = 100

[tool.isort]
line_length = 100

[tool.ruff]
lint.select = ["F401"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["F401"]
