# Check https://www.mkdocs.org/user-guide/configuration/
# for more MkDocs configuration details

site_name: Tactics2d
site_url: https://tactics2d.readthedocs.io/en/latest/
site_description: The official documentation of Tactics2d.
site_author: WoodOxen
repo_url: https://github.com/WoodOxen/tactics2d

docs_dir: docs
nav:
  - Home: "index.md"
  - Release Notes: "release_notes.md"
  - Installation: "installation.md"
  - Dataset Support:
    - "dataset_support/index.md"
    - CitySim: "dataset_support/citysim.ipynb"
    - Dragon Lake Parking: "dataset_support/dlp.ipynb"
    - DriveInsight: "dataset_support/driveinsightd.ipynb"
    - highD (LevelX): "dataset_support/highd.ipynb"
    - inD (LevelX): "dataset_support/ind.ipynb"
    - rounD (LevelX): "dataset_support/round.ipynb"
    - exiD (LevelX): "dataset_support/exid.ipynb"
    - uniD (LevelX): "dataset_support/unid.ipynb"
    - NuPlan: "dataset_support/nuplan.ipynb"
    - Waymo Open Motion Dataset (WOMD): "dataset_support/womd.ipynb"
  - Python API:
    - tactics2d.behavior: "api/behavior.md"
    - tactics2d.controller: "api/controller.md"
    - tactics2d.display: "api/display.md"
    - tactics2d.dataset_parser: "api/dataset_parser.md"
    - tactics2d.envs: "api/envs.md"
    - tactics2d.geometry: "api/geometry.md"
    - tactics2d.interpolator: "api/interpolator.md"
    - tactics2d.map: "api/map.md"
    - tactics2d.participant: "api/participant.md"
    - tactics2d.physics: "api/physics.md"
    - tactics2d.routing: "api/routing.md"
    - tactics2d.search: "api/search.md"
    - tactics2d.traffic: "api/traffic.md"
  - Tutorial:
    - browser_frontend: "tutorial/browser_frontend.md"
    - Graph-based Planning Algorithms: "tutorial/graph_search_demo.ipynb"
    - Sampling-based Planning Algorithms: "tutorial/sampling_search_demo.ipynb"
    - Routing Demo on WOMD Map: "tutorial/routing.ipynb"
    - "Behavior Modeling API: LimSim Implementation": "tutorial/behavior_limsim_demo.ipynb"
    - "Behavior Modeling API: BITS Implementation": "tutorial/behavior_bits_demo.ipynb"
    - "Behavior Modeling API: InterSim Implementation": "tutorial/behavior_intersim_demo.ipynb"
    - "Behavior Modeling API: SMART Implementation": "tutorial/behavior_smart_demo.ipynb"
  - Community: "community.md"
  - Publications: "publication.md"

theme:
  name: "material"
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
    palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: "Roboto Slab"
    code: "Cousine"
  features:
    - content.action.view
    - content.code.copy
    - content.code.prettify
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.integrate
    - navigation.top
    - navigation.sections
    - search.suggest
    - toc.follow
    - toc.integrate

hooks:
  - hooks/notebook_pages.py
  - hooks/notebook_admonitions.py

plugins:
  - glightbox
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            heading_level: 1
            show_root_heading: true
            docstring_section_style: list
  - mkdocs-jupyter:
      execute: false
      include_requirejs: true
      include_source: true
      kernel_name: python3
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - toc:
      toc_depth: 2
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji

extra_javascript:
  - javascripts/katex.js
  - javascripts/hide_code.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - css/extra_for_material.css
  - css/hide_code.css
  - https://unpkg.com/katex@0/dist/katex.min.css
